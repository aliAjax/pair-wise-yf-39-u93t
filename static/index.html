<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实验室检测板排样</title>
  <style>
    :root { --line:#e5e7eb; --bg:#f9fafb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --blue:#2563eb; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; color: #1f2937; background: var(--bg); }
    header { background: #111827; color: #fff; padding: .9rem 1.2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    header .auth { display: flex; gap: .5rem; align-items: center; margin-left: auto; font-size: .85rem; }
    header input, header select { padding: .3rem .5rem; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #fff; }
    main { max-width: 1180px; margin: 1.2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 360px 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
    .card h2 { font-size: .95rem; margin: 0 0 .7rem; }
    .card h3 { font-size: .85rem; margin: .9rem 0 .4rem; color: #374151; }
    label { font-size: .78rem; color: #4b5563; display: block; margin: .45rem 0 .15rem; }
    input[type=text], input[type=number], select { width: 100%; padding: .42rem .55rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .85rem; }
    button { padding: .45rem .8rem; border-radius: 6px; border: 1px solid #2563eb; background: var(--blue); color: #fff; font-size: .83rem; cursor: pointer; }
    button.secondary { background: #fff; color: var(--blue); }
    button.ghost { background: transparent; border-color: #9ca3af; color: #374151; }
    button.danger { border-color: var(--bad); background: var(--bad); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: .5rem; }
    .row > * { flex: 1; }
    .msg { margin: .6rem 0; padding: .5rem .7rem; border-radius: 6px; font-size: .82rem; white-space: pre-wrap; display: none; }
    .msg.ok { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    ul.tabs { list-style: none; display: flex; gap: .4rem; padding: 0; margin: 0 0 .8rem; flex-wrap: wrap; }
    ul.tabs li { padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--line); font-size: .82rem; cursor: pointer; background: #fff; }
    ul.tabs li.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th, td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: #6b7280; font-weight: 600; font-size: .72rem; text-transform: uppercase; }
    .tag { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .7rem; border: 1px solid; }
    .tag.in_lab { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
    .tag.resulted { color: #166534; border-color: #86efac; background: #f0fdf4; }
    .tag.closed { color: #4b5563; border-color: #d1d5db; background: #f9fafb; }
    .tag.collected { color: #1e40af; border-color: #93c5fd; background: #eff6ff; }
    .tag.draft { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
    .tag.testing { color: #1e40af; border-color: #93c5fd; background: #eff6ff; }
    .tag.confirmed { color: #166534; border-color: #86efac; background: #f0fdf4; }
    .tag.abandoned { color: #6b7280; border-color: #d1d5db; background: #f3f4f6; }
    .plates-list button { width: 100%; text-align: left; margin-bottom: .35rem; background: #f9fafb; color: #1f2937; border-color: var(--line); }
    .plates-list button.active { border-color: var(--blue); background: #eff6ff; }
    .muted { color: #9ca3af; font-size: .76rem; }
    .blockers { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: .6rem .8rem; font-size: .82rem; margin: .6rem 0; }
    .blockers ul { margin: .3rem 0 0 1rem; padding: 0; }
    .ready-note { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 8px; padding: .5rem .8rem; font-size: .82rem; margin: .6rem 0; }
    .grid-wrap { overflow-x: auto; }
    table.grid { border-collapse: separate; border-spacing: 2px; }
    table.grid td { border: 1px solid var(--line); border-radius: 6px; min-width: 86px; max-width: 120px; height: 64px; padding: .25rem; vertical-align: top; position: relative; background: #fff; font-size: .68rem; cursor: pointer; }
    table.grid td.empty { background: #fafafa; color: #c0c5cc; text-align: center; vertical-align: middle; cursor: default; }
    table.grid td.sample { background: #eff6ff; }
    table.grid td.control { background: #f5f3ff; }
    table.grid td.missing { outline: 2px dashed #f59e0b; outline-offset: -2px; }
    table.grid td.invalid { outline: 2px solid var(--bad); outline-offset: -2px; }
    table.grid td.done { border-color: #86efac; }
    .well-pos { font-weight: 700; font-size: .66rem; color: #374151; }
    .well-meta { color: #4b5563; word-break: break-all; line-height: 1.25; }
    .well-res { font-weight: 700; }
    .well-res.positive { color: var(--bad); }
    .well-res.negative { color: var(--blue); }
    .corner { background: #f3f4f6; font-weight: 700; color: #6b7280; text-align: center; vertical-align: middle; }
    .editor { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
    .editor.open { display: flex; }
    .editor .card { width: 340px; }
    .editor .row { margin-top: .8rem; justify-content: flex-end; }
    .editor .row button { flex: 0 1 auto; }
    .pill-row { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.3rem; }
    .pill { font-size:.72rem; padding:.15rem .5rem; border-radius:999px; border:1px solid var(--line); }
  </style>
</head>
<body>
<header>
  <h1>实验室检测板排样</h1>
  <div class="auth">
    <label style="color:#d1d5db;margin:0">操作人</label>
    <input id="userId" value="lab-1" size="8">
    <label style="color:#d1d5db;margin:0">角色</label>
    <select id="role">
      <option value="lab">lab 检测员</option>
      <option value="admin">admin 管理员</option>
      <option value="field">field 现场</option>
      <option value="epidemiologist">epidemiologist 流调</option>
      <option value="viewer">viewer 只读</option>
    </select>
    <button class="ghost" style="color:#fff;border-color:#6b7280" onclick="loadAll()">刷新</button>
  </div>
</header>

<main>
  <section>
    <div class="card">
      <h2>快速造一条已送检样本</h2>
      <div class="row">
        <div style="flex:2"><label>样本编号</label><input id="qCode" type="text" placeholder="W-100"></div>
        <div><label>实验室</label><input id="qLab" type="text" value="LAB-1"></div>
      </div>
      <div style="margin-top:.6rem"><button onclick="quickSample()">创建并送检</button></div>
      <div id="quickMsg" class="msg"></div>
    </div>

    <div class="card" style="margin-top:1rem">
      <h2>新建检测板</h2>
      <label>板号（唯一）</label>
      <input id="newCode" type="text" placeholder="P-2026-001">
      <div class="row">
        <div><label>行数</label><input id="newRows" type="number" value="8" min="1" max="16"></div>
        <div><label>列数</label><input id="newCols" type="number" value="12" min="1" max="24"></div>
      </div>
      <div style="margin-top:.6rem"><button onclick="createPlate()">建板（空板，draft）</button></div>
      <div id="plateMsg" class="msg"></div>
    </div>

    <div class="card" style="margin-top:1rem">
      <h2>检测板列表</h2>
      <div id="platesList" class="plates-list"><span class="muted">加载中…</span></div>
    </div>

    <div class="card" style="margin-top:1rem">
      <h2>已送检样本（可排样）</h2>
      <div id="sampleList"></div>
    </div>
  </section>

  <section class="card" id="platePanel">
    <h2 id="plateTitle">请选择左侧检测板</h2>
    <div id="plateMeta"></div>
    <div id="blockers"></div>
    <div class="grid-wrap" id="gridWrap"></div>
    <div id="plateActions" style="margin-top:.8rem; display:flex; gap:.6rem; flex-wrap:wrap;"></div>
    <h3>结果样本</h3>
    <div id="resultedList"><span class="muted">无</span></div>
  </section>
</main>

<div class="editor" id="editor">
  <div class="card">
    <h2 id="edTitle">孔位</h2>
    <div id="edBody"></div>
    <div id="edMsg" class="msg"></div>
    <div class="row">
      <button class="ghost" onclick="closeEditor()">取消</button>
      <button id="edSave" onclick="saveWell()">保存</button>
    </div>
  </div>
</div>

<script>
let samples = [], plates = [], currentPlateId = null, editing = null, mode = "layout";

function authHeaders(extra) {
  return Object.assign({
    "Content-Type": "application/json",
    "X-User-Id": document.getElementById("userId").value || "anonymous",
    "X-Role": document.getElementById("role").value
  }, extra || {});
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: authHeaders(), body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

function show(el, text, ok) {
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

function esc(v) { return String(v == null ? "" : v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function statusTag(s) { return '<span class="tag ' + s + '">' + esc(s) + "</span>"; }

async function loadAll() {
  const [s, p] = await Promise.all([api("GET", "/api/samples"), api("GET", "/api/plates")]);
  samples = s.items; plates = p.items;
  renderSamples(); renderPlates();
  if (currentPlateId) await openPlate(currentPlateId); else emptyPanel();
}

function renderSamples() {
  const inLab = samples.filter(x => x.status === "in_lab");
  const el = document.getElementById("sampleList");
  if (!inLab.length) { el.innerHTML = '<span class="muted">暂无在检样本，可在左上快速创建。</span>'; return; }
  el.innerHTML = "<table><tr><th>编号</th><th>状态</th><th>观察</th></tr>" + inLab.map(x =>
    `<tr><td>${esc(x.data.sample_code)}</td><td>${statusTag(x.status)}</td><td class="muted">${esc(x.data.observation_id)}</td></tr>`).join("") + "</table>";
}

function renderPlates() {
  const el = document.getElementById("platesList");
  if (!plates.length) { el.innerHTML = '<span class="muted">还没有检测板。</span>'; return; }
  const order = { testing: 0, draft: 1, confirmed: 2, abandoned: 3 };
  el.innerHTML = plates.slice().sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9)).map(p =>
    `<button class="${p.id === currentPlateId ? "active" : ""}" onclick="openPlate('${p.id}')">
       <strong>${esc(p.data.plate_code)}</strong> ${statusTag(p.status)}
       <div class="muted">${p.data.rows}×${p.data.cols} · ${usedCount(p)} 孔已排</div>
     </button>`).join("");
}

function usedCount(p) { return (p.data.wells || []).filter(w => w.sample_id || w.control).length; }

function emptyPanel() {
  document.getElementById("plateTitle").textContent = "请选择左侧检测板";
  document.getElementById("plateMeta").innerHTML = "";
  document.getElementById("blockers").innerHTML = "";
  document.getElementById("gridWrap").innerHTML = "";
  document.getElementById("plateActions").innerHTML = "";
  renderResulted();
}

async function openPlate(id) {
  currentPlateId = id;
  const r = await api("GET", "/api/plates/" + id + "/readiness");
  renderPlates();
  document.getElementById("plateTitle").textContent = "检测板 " + r.plate_code;
  document.getElementById("plateMeta").innerHTML =
    statusTag(r.status) + ` <span class="muted">${r.rows} 行 × ${r.cols} 列 · ${r.wells.filter(w=>w.used).length} 孔已排 · ${r.wells.filter(w=>w.has_result).length} 孔有结果</span>`;

  const box = document.getElementById("blockers");
  if (r.status !== "confirmed" && r.status !== "abandoned") {
    if (r.blockers.length) {
      box.innerHTML = `<div class="blockers"><strong>阻塞原因（${r.blockers.length}）</strong><ul>${r.blockers.map(b => "<li>" + esc(b) + "</li>").join("")}</ul></div>`;
    } else if (r.status === "testing") {
      box.innerHTML = '<div class="ready-note">整板结果齐全且对照有效，可以确认。</div>';
    } else {
      box.innerHTML = '<div class="ready-note">排样完整后可开始检测。</div>';
    }
  } else box.innerHTML = "";

  renderGrid(r);
  renderActions(r);
}

function renderGrid(r) {
  mode = r.status === "draft" ? "layout" : "result";
  const letters = "ABCDEFGHIJKLMNOP".slice(0, r.rows).split("");
  let html = '<table class="grid"><tr><td class="corner"></td>';
  for (let c = 1; c <= r.cols; c++) html += `<td class="corner">${c}</td>`;
  html += "</tr>";
  for (const row of letters) {
    html += "<tr><td class='corner'>" + row + "</td>";
    for (let c = 1; c <= r.cols; c++) {
      const pos = row + c;
      const w = r.wells.find(x => x.position === pos) || { position: pos };
      const editable = r.status === "draft" || r.status === "testing";
      let cls = "empty", body = esc(pos);
      let flags = "";
      if (w.control) {
        cls = "control";
        body = `<div class="well-pos">${pos}</div><div class="well-meta">对照·${w.control === "positive" ? "阳" : "阴"}</div>`;
      } else if (w.sample_id) {
        cls = "sample";
        body = `<div class="well-pos">${pos}</div><div class="well-meta">${esc(w.sample_code || w.sample_id)}</div>`;
      }
      if (w.used) {
        if (!w.has_result && r.status !== "draft") flags += " missing";
        if (w.has_result) {
          cls += " done";
          const invalidControl = w.control && w.control !== w.result;
          if (invalidControl) flags += " invalid";
          body += `<div class="well-res ${w.result}">${w.result === "positive" ? "阳性" : "阴性"}</div>`;
        }
      }
      html += `<td class="${cls}${flags}" ${editable && w.used ? `onclick="openEditor('${pos}', ${r.status === 'testing'})"` : (editable ? `onclick="openEditor('${pos}', false)"` : "")}>${body}</td>`;
    }
    html += "</tr>";
  }
  html += "</table>";
  document.getElementById("gridWrap").innerHTML = html;
}

function renderActions(r) {
  const el = document.getElementById("plateActions");
  const btns = [];
  if (r.status === "draft") {
    const used = r.wells.filter(w => w.used).length;
    btns.push(`<button onclick="startTesting()" ${used ? "" : "disabled"}>开始检测（draft → testing）</button>`);
    btns.push(`<button class="danger" onclick="abandonPlate()">作废</button>`);
  } else if (r.status === "testing") {
    btns.push(`<button onclick="confirmPlate()" ${r.ready ? "" : "disabled"}>确认整板</button>`);
    btns.push(`<button class="danger" onclick="abandonPlate()">作废</button>`);
  }
  el.innerHTML = btns.join("");
}

function openEditor(pos, resultMode) {
  const plate = plates.find(p => p.id === currentPlateId);
  const well = (plate.data.wells || []).find(w => w.position === pos);
  editing = { pos, well: well || { position: pos } };
  document.getElementById("edTitle").textContent = "孔位 " + pos;
  const body = document.getElementById("edBody");
  document.getElementById("edMsg").className = "msg";
  if (resultMode) {
    mode = "result";
    body.innerHTML = `<p class="muted">${well && well.control ? "对照孔：" + (well.control === "positive" ? "阳性对照" : "阴性对照") : "样本：" + esc(sampleLabel(well && well.sample_id))}</p>
      <label>结果</label>
      <select id="edResult">
        <option value="positive">阳性 positive</option>
        <option value="negative">阴性 negative</option>
      </select>`;
    if (well && well.result) document.getElementById("edResult").value = well.result;
  } else {
    mode = "layout";
    const inLab = samples.filter(s => s.status === "in_lab");
    body.innerHTML = `<div class="pill-row">
        <label style="margin:0"><input type="radio" name="wtype" value="sample" ${well && well.control ? "" : "checked"}> 样本</label>
        <label style="margin:0"><input type="radio" name="wtype" value="control" ${well && well.control ? "checked" : ""}> 对照孔（单独标注）</label>
      </div>
      <div id="samplePick"><label>选择已送检样本</label>
        <select id="edSample">${inLab.map(s => `<option value="${s.id}">${esc(s.data.sample_code)} (${s.id.slice(0,8)})</option>`).join("")}</select></div>
      <div id="controlPick" style="display:none"><label>对照类型</label>
        <select id="edControl"><option value="positive">阳性对照</option><option value="negative">阴性对照</option></select></div>`;
    if (well && well.control) {
      document.getElementById("edControl").value = well.control;
      toggleEditorType();
    } else if (well && well.sample_id) {
      const sel = document.getElementById("edSample");
      if (Array.from(sel.options).some(o => o.value === well.sample_id)) sel.value = well.sample_id;
    }
    body.querySelectorAll("input[name=wtype]").forEach(r => r.onchange = toggleEditorType);
  }
  document.getElementById("editor").classList.add("open");
}

function toggleEditorType() {
  const isControl = document.querySelector("input[name=wtype]:checked").value === "control";
  document.getElementById("samplePick").style.display = isControl ? "none" : "";
  document.getElementById("controlPick").style.display = isControl ? "" : "none";
}

function closeEditor() {
  document.getElementById("editor").classList.remove("open");
  editing = null;
}

function sampleLabel(id) {
  const s = samples.find(x => x.id === id);
  return s ? s.data.sample_code : (id || "空孔");
}

async function saveWell() {
  const msg = document.getElementById("edMsg");
  try {
    if (mode === "result") {
      const result = document.getElementById("edResult").value;
      await api("POST", "/api/entities/" + currentPlateId + "/actions", {
        action: "record_results", data: { results: { [editing.pos]: result } }
      });
    } else {
      const isControl = document.querySelector("input[name=wtype]:checked").value === "control";
      const well = isControl
        ? { position: editing.pos, control: document.getElementById("edControl").value }
        : { position: editing.pos, sample_id: document.getElementById("edSample").value };
      await api("POST", "/api/entities/" + currentPlateId + "/actions", {
        action: "add_wells", data: { wells: [well] }
      });
    }
    closeEditor();
    await loadAll();
  } catch (e) { show(msg, e.message, false); }
}

async function quickSample() {
  const msg = document.getElementById("quickMsg");
  const code = document.getElementById("qCode").value.trim();
  if (!code) return show(msg, "请填写样本编号", false);
  try {
    const eventId = "E-" + code;
    const obs = await api("POST", "/api/observations", {
      event_id: eventId, species: "deer", location: "North",
      observed_at: new Date().toISOString().slice(0, 10), lat: 40.0, lon: 116.0
    });
    await api("POST", "/api/entities/" + obs.id + "/actions", {
      action: "submit", data: { location: "North", observed_at: obs.data.observed_at }
    });
    const sample = await api("POST", "/api/samples", { observation_id: obs.id, sample_code: code });
    await api("POST", "/api/entities/" + sample.id + "/actions", {
      action: "send_lab", data: { lab_id: document.getElementById("qLab").value || "LAB-1" }
    });
    document.getElementById("qCode").value = "";
    show(msg, "样本 " + code + " 已送检（in_lab），可排样。", true);
    await loadAll();
  } catch (e) { show(msg, e.message, false); }
}

async function createPlate() {
  const msg = document.getElementById("plateMsg");
  const code = document.getElementById("newCode").value.trim();
  if (!code) return show(msg, "请填写板号", false);
  try {
    const p = await api("POST", "/api/plates", {
      plate_code: code,
      rows: parseInt(document.getElementById("newRows").value || "8", 10),
      cols: parseInt(document.getElementById("newCols").value || "12", 10)
    });
    document.getElementById("newCode").value = "";
    show(msg, "检测板 " + p.data.plate_code + " 已创建（draft）。", true);
    await loadAll();
    openPlate(p.id);
  } catch (e) { show(msg, e.message, false); }
}

async function startTesting() {
  try {
    await api("POST", "/api/entities/" + currentPlateId + "/actions", { action: "start_testing", data: {} });
    await loadAll();
  } catch (e) { alert(e.message); }
}

async function confirmPlate() {
  try {
    await api("POST", "/api/entities/" + currentPlateId + "/actions", { action: "confirm_plate", data: {} });
    await loadAll();
    alert("整板已确认：阳性样本转入已出结果（含检测板号），阴性样本已关闭。");
  } catch (e) {
    await loadAll();
    alert(e.message);
  }
}

async function abandonPlate() {
  if (!confirm("作废该板？板上样本将恢复可排样状态（样本本身状态不变）。")) return;
  try {
    await api("POST", "/api/entities/" + currentPlateId + "/actions", { action: "abandon", data: {} });
    await loadAll();
  } catch (e) { alert(e.message); }
}

function renderResulted() {
  const el = document.getElementById("resultedList");
  const items = samples.filter(s => s.status === "resulted");
  if (!items.length) { el.innerHTML = '<span class="muted">暂无已出结果样本。</span>'; return; }
  el.innerHTML = "<table><tr><th>样本</th><th>结果</th><th>检测板/孔位</th><th></th></tr>" +
    items.map(s => `<tr>
      <td>${esc(s.data.sample_code)}</td>
      <td><strong class="well-res ${s.data.result}">${s.data.result === "positive" ? "阳性" : esc(s.data.result)}</strong></td>
      <td class="muted">${esc(s.data.result_plate_code || "")} ${esc(s.data.result_well || "")}
        ${(s.data.result_history || []).length ? "<br>复测 " + s.data.result_history.length + " 次（沿用首次 " + esc(s.data.result) + "）" : ""}</td>
      <td><button class="secondary" style="padding:.2rem .5rem" onclick="retest('${s.id}')">复测</button></td>
    </tr>`).join("") + "</table>";
}

async function retest(id) {
  const reason = prompt("复测原因？", "qc");
  if (reason === null) return;
  try {
    await api("POST", "/api/entities/" + id + "/actions", { action: "retest", data: { reason } });
    await loadAll();
  } catch (e) { alert(e.message); }
}

loadAll().catch(e => alert("加载失败: " + e.message));
</script>
</body>
</html>
